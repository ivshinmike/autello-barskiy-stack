# Autéllo: публичный Nginx, PostgreSQL, бэкенд (только внутри сети — без опубликованных портов), Watchtower.
# pgAdmin и Docker Registry по умолчанию выключены: docker compose --profile tools up -d
# Перед запуском: cp .env.example .env && отредактируйте.
# Поднять: docker compose up -d

name: autello

services:
  # --- Публичный вход: сайт, фронт, проксирование API к бэку (см. config/nginx) ---
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      # - "443:443"   # раскомментируйте при TLS; смонтируйте сертификаты
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - autello
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- БД: порт 5432 не публикуем, доступ только из сети compose (бэк, pgadmin) ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_dot_env}
      POSTGRES_DB: ${POSTGRES_DB:-autello}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - autello
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Админка БД (опционально, профиль tools) ---
  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      # AUTELLO_* — из .env; не используйте PGADMIN_DEFAULT_* в compose: IDE часто экспортирует их в shell и подменяет .env
      PGADMIN_DEFAULT_EMAIL: ${AUTELLO_PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${AUTELLO_PGADMIN_PASSWORD:-change_me_in_dot_env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autello

  pgadmin-nginx:
    image: nginx:1.27-alpine
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - pgadmin
    volumes:
      - ./config/pgadmin-nginx/gate.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - autello
    ports:
      - "${PGADMIN_BIND_ADDRESS:-0.0.0.0}:5050:80"

  # ---------------------------------------------------------------------------
  # Реестр образов (опционально, профиль tools). См. .env.example (htpasswd, insecure-registries).
  # ---------------------------------------------------------------------------
  registry:
    image: registry:2.8.3
    profiles: ["tools"]
    restart: unless-stopped
    volumes:
      - registry_data:/var/lib/registry
      - ./config/registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./registry-auth/htpasswd:/auth/htpasswd:ro
    networks:
      - autello
    ports:
      - "5000:5000"
    # С включённым auth GET /v2/ даёт 401 — проверяем, что порт слушается.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # --- Обновление образов запущенных контейнеров (по расписанию) ---
  # containrrr/watchtower: в образе client API 1.25 — с Docker 25+ (min API 1.40) контейнер падает. Форк с актуальным client:
  watchtower:
    image: nickfedor/watchtower:latest@sha256:62bec6c1a89e9882970130a311f0ac27faf11f26520b8755ca6a78802a1a6d8f
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      # Раскомментируйте, чтобы обновлялись только сервисы с меткой:
      # WATCHTOWER_LABEL_ENABLE: "true"
    networks:
      - autello
    # при LABEL_ENABLE: true добавьте к сервису:
    # labels: [ com.centurylinklabs.watchtower.enable: "true" ]

  # ---------------------------------------------------------------------------
  # API: :8000 только в сети autello. Снаружи — Nginx: /api/, /docs — см. default.conf; порты наружу нет.
  # Строка БД: asyncpg; спецсимволы в POSTGRES_PASSWORD — URL-экранируйте.
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # true — встроенные /docs у бэка; с Nginx пути документации по умолчанию 404
      ENABLE_OPENAPI: ${ENABLE_OPENAPI:-false}
      # JWT для админ-панели; в бою задайте длинную случайную строку в .env
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_dev_only}
    networks: [ autello ]
    depends_on:
      postgres: { condition: service_healthy }
    # labels: { "com.centurylinklabs.watchtower.enable": "true" }  # при WATCHTOWER_LABEL_ENABLE
  # (при необходимости добавьте сюда frontend, если он отдельным контейнером)

volumes:
  pg_data:
  registry_data:
  pgadmin_data:

networks:
  autello:
    name: autello
    driver: bridge
