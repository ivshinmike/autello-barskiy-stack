# Nginx: единственная публичная точка для HTTP к приложению.
# Бэкенд не публикуйте портами — проксирование только сюда, из внутренней сети compose.

upstream autello_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Статика SPA (npm run build в ./frontend → ./frontend/dist, см. volume в compose)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Swagger / OpenAPI (включено при ENABLE_OPENAPI=1 в бэке; иначе 404)
    # Без отдельных location запрос /docs упрётся в location /.
    location /docs {
        proxy_pass http://autello_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /openapi.json {
        proxy_pass http://autello_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass http://autello_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API бэка — только через Nginx, бэк без published ports
    location /api/ {
        proxy_pass http://autello_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Телеметрия шлёт накопленный JSON курсора; запас по размеру тела
        client_max_body_size 16m;
    }
}
