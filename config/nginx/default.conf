# Nginx: единственная публичная точка для HTTP к приложению.
# Бэкенд не публикуйте портами — проксирование только сюда, из внутренней сети compose.

# Раскомментируйте после появления контейнеров:
# upstream autello_frontend {
#     server frontend:80;
#     keepalive 32;
# }
# upstream autello_backend {
#     server backend:8000;
#     keepalive 16;
# }

server {
    listen 80;
    server_name _;

    # Сайт: отдача фронта
    location / {
        return 200 "Nginx: подключите upstream autello_frontend (см. config/nginx/default.conf)\n\npgAdmin не здесь. На сервере: http://127.0.0.1:5050/ (порт 5050, не /путь на :80)\n";
        add_header Content-Type text/plain;
        # try_files $uri $uri/ /index.html;  # для SPA, когда будет статика/фронт
        # proxy_pass http://autello_frontend;
    }

    # API бэка — только через Nginx, бэк без published ports
    # location /api/ {
    #     proxy_pass http://autello_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
