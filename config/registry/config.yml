# Конфигурация Docker Registry v2: локальное хранилище + basic auth (htpasswd).
# Пароль для docker login: см. registry-auth/htpasswd (см. .env.example).

version: 0.1

log:
  level: info
  fields:
    service: registry

storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true

http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]

auth:
  htpasswd:
    realm: "Autello Docker Registry"
    path: /auth/htpasswd
